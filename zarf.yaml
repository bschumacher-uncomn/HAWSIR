# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: navifi
  description: NAVIFI mission consequence engine for shipboard RKE2 + UDS Core (air-gapped)
  version: 0.10.0
  url: https://github.com/navifi/navifi
  architecture: amd64

variables:
  - name: DOMAIN
    description: UDS tenant domain aboard the hull
    default: uds.dev
  - name: AUDIT_STORAGE
    description: Size of the append-only audit volume
    default: 2Gi

components:
  - name: navifi
    description: Engine, watch floor UI and audit edge copy
    required: true
    charts:
      - name: navifi
        namespace: navifi
        version: 0.10.0
        localPath: deploy/chart/navifi
        valuesFiles:
          - deploy/values/zarf-values.yaml
    images:
      - ghcr.io/navifi/navifi:0.10.0
    actions:
      onDeploy:
        after:
          - description: Wait for the edge node to report healthy
            wait:
              cluster:
                kind: Deployment
                name: navifi
                namespace: navifi
                condition: Available

  - name: narrator
    description: Optional in-cluster narrator (explanations only, never in the calculation path)
    required: false
    charts:
      - name: navifi-narrator
        namespace: navifi
        version: 0.10.0
        localPath: deploy/chart/navifi
        valuesFiles:
          - deploy/values/zarf-narrator-values.yaml
    images:
      - vllm/vllm-openai:v0.6.3
    dataInjections:
      # Model weights ride inside the package so nothing is fetched at sea.
      - source: models/qwen2.5-3b-instruct
        target:
          namespace: navifi
          selector: app.kubernetes.io/name=vllm
          container: vllm
          path: /models
        compress: true
