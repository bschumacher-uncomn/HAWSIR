# One MinIO for the whole lab. Production UDS Core points Loki and Velero at a
# cloud object store instead.
mode: standalone
replicas: 1

# MinIO no longer publishes public images on quay.io or Docker Hub. This is the
# Chainguard build that Defense Unicorns' uds-k3d dev stack runs with this
# chart version; it carries both the server and the mc client the setup job uses.
image:
  repository: ghcr.io/uds-packages/minio-operator/container/chainguard/minio
  tag: 0.20260717.120751-r16
mcImage:
  repository: ghcr.io/uds-packages/minio-operator/container/chainguard/minio
  tag: 0.20260717.120751-r16

rootUser: minio-root
rootPassword: "###ZARF_VAR_MINIO_ROOT_PASSWORD###"

persistence:
  size: 50Gi

# The chart requests 16Gi by default.
resources:
  requests:
    cpu: 100m
    memory: 512Mi

buckets:
  - name: loki
    policy: none
  - name: velero
    policy: none

# Replaces the chart's default console/console123 user.
users:
  - accessKey: "###ZARF_VAR_STORAGE_ACCESS_KEY###"
    secretKey: "###ZARF_VAR_STORAGE_SECRET_KEY###"
    policy: readwrite
