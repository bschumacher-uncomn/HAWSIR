# Mirror of .github/workflows/ci.yml for GitLab-based software factories.
stages: [review, test, security, build, compliance, package]

variables:
  IMAGE: $CI_REGISTRY_IMAGE

.node: &node
  image: node:22
  before_script:
    - corepack enable && corepack prepare pnpm@9.3.0 --activate
    - pnpm install --frozen-lockfile
  cache:
    key: { files: [pnpm-lock.yaml] }
    paths: [.pnpm-store]

ai-review:
  stage: review
  image: node:20
  rules: [{ if: $CI_PIPELINE_SOURCE == "merge_request_event" }]
  allow_failure: true
  variables:
    BASE_REF: origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    GIT_DEPTH: 0
  script: [node ci/ai-review.mjs]
  artifacts: { paths: [ai-review.md], when: always }

test:
  <<: *node
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_PASSWORD: postgres
    PG_URL: postgres://postgres:postgres@postgres:5432
  script:
    - npm --prefix mission-engine ci && npm --prefix mission-engine run typecheck && npm --prefix mission-engine test
    - npm --prefix mission-api ci && npm --prefix mission-api run typecheck && npm --prefix mission-api test && npm --prefix mission-api run build
    - pnpm typecheck
    - pnpm test
    - pnpm build
    - pnpm oscal && git diff --exit-code compliance/

semgrep:
  stage: security
  image: semgrep/semgrep
  script: [semgrep scan --config p/typescript --config p/secrets --config p/dockerfile --error]

image:
  stage: build
  image: { name: gcr.io/kaniko-project/executor:debug, entrypoint: [""] }
  script:
    - /kaniko/executor --context . --dockerfile Dockerfile --destination $IMAGE/hawsir-web:$CI_COMMIT_SHA --digest-file digest-web.txt
    - /kaniko/executor --context . --dockerfile mission-api/Dockerfile --destination $IMAGE/hawsir-api:$CI_COMMIT_SHA --digest-file digest-api.txt
  artifacts: { paths: [digest-web.txt, digest-api.txt] }

sbom-scan-sign:
  stage: build
  needs: [image]
  image: alpine:3.20
  id_tokens: { SIGSTORE_ID_TOKEN: { aud: sigstore } }
  script:
    - apk add --no-cache curl cosign
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
    - curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
    - |
      for c in web api; do
        syft $IMAGE/hawsir-$c:$CI_COMMIT_SHA -o spdx-json > sbom-$c.spdx.json
        grype $IMAGE/hawsir-$c:$CI_COMMIT_SHA --fail-on high
        cosign sign --yes $IMAGE/hawsir-$c@$(cat digest-$c.txt)
        cosign attest --yes --type spdxjson --predicate sbom-$c.spdx.json $IMAGE/hawsir-$c@$(cat digest-$c.txt)
      done
  artifacts: { paths: [sbom-web.spdx.json, sbom-api.spdx.json] }

lula:
  stage: compliance
  image: ghcr.io/defenseunicorns/build-harness/build-harness:latest
  rules: [{ if: $CI_COMMIT_TAG }, { if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH }]
  script:
    - uds deploy k3d-core-slim-dev:0.29.1 --confirm
    - zarf package create . --confirm -o build/ && zarf package deploy build/zarf-package-hawsir-*.tar.zst --confirm
    - lula validate -f compliance/oscal-component.yaml -o build/assessment-results.yaml
  artifacts: { paths: [build/assessment-results.yaml] }

bundle:
  stage: package
  image: ghcr.io/defenseunicorns/build-harness/build-harness:latest
  rules: [{ if: $CI_COMMIT_TAG }]
  script:
    - zarf package create . --confirm -o build/
    - uds create . --confirm -o build/
  artifacts: { paths: [build/uds-bundle-*.tar.zst] }
