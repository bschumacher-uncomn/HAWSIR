# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/main/uds.schema.json
# One file to carry aboard: Zarf init + UDS Core + HAWSIR.
#   uds create .            (pier side, connected)
#   uds deploy uds-bundle-hawsir-ship-amd64-0.11.0.tar.zst   (aboard, air-gapped)
kind: UDSBundle
metadata:
  name: hawsir-ship
  description: Shipboard decision-support bundle on RKE2
  version: 0.11.0

packages:
  - name: init
    repository: ghcr.io/zarf-dev/packages/init
    ref: v0.41.0

  - name: core
    repository: ghcr.io/defenseunicorns/packages/uds/core
    ref: 0.29.1-registry1

  - name: hawsir
    path: ./
    ref: 0.11.0
    optionalComponents:
      - narrator
    overrides:
      hawsir:
        hawsir:
          variables:
            - name: HAWSIR_DOMAIN
              path: domain
              description: Tenant domain aboard this hull
            - name: HAWSIR_PEER_URL
              path: node.peerUrl
              description: Shore mission-api reached over the data link
