  back-matter:
    resources:
      - uuid: eb8c73bf-37d7-5fb3-b695-1479ab57996f
        title: "Every HAWSIR pod runs as non-root with all capabilities dropped"
        rlinks:
          - href: lula.dev
        description: |
          metadata:
            name: hawsir-pods-nonroot
            uuid: 8bcd2c8c-c8a3-5d8a-8c5c-64c3611c41d6
          domain:
            type: kubernetes
            kubernetes-spec:
              resources:
                - name: pods
                  resource-rule:
                    version: v1
                    resource: pods
                    namespaces: [hawsir]
          provider:
            type: opa
            opa-spec:
              rego: |
                package validate
                import rego.v1
                default validate := false
                validate if {
                  count(input.pods) > 0
                  every pod in input.pods {
                    pod.spec.securityContext.runAsNonRoot == true
                    every c in pod.spec.containers {
                      c.securityContext.allowPrivilegeEscalation == false
                      "ALL" in c.securityContext.capabilities.drop
                    }
                  }
                }
      - uuid: 08e3080a-e202-5f93-9465-e8dbc110ecca
        title: "HAWSIR namespace is enrolled in the Istio mesh (mTLS) by UDS Core"
        rlinks:
          - href: lula.dev
        description: |
          metadata:
            name: hawsir-mesh-enrolled
            uuid: b4b16a23-ce37-51f7-9fec-ca8f403327ea
          domain:
            type: kubernetes
            kubernetes-spec:
              resources:
                - name: ns
                  resource-rule:
                    version: v1
                    resource: namespaces
                    name: hawsir
          provider:
            type: opa
            opa-spec:
              rego: |
                package validate
                import rego.v1
                default validate := false
                validate if input.ns.metadata.labels["istio-injection"] == "enabled"
                validate if input.ns.metadata.labels["istio.io/dataplane-mode"] == "ambient"
      - uuid: 5f6a4a43-d2ff-51e4-9ac3-ade04f2b463f
        title: "Postgres volume holding the fact and decision logs exists and is bound"
        rlinks:
          - href: lula.dev
        description: |
          metadata:
            name: hawsir-data-volume
            uuid: cb23b2ef-a3e2-56f3-8183-5ad72f8e84f1
          domain:
            type: kubernetes
            kubernetes-spec:
              resources:
                - name: pvcs
                  resource-rule:
                    version: v1
                    resource: persistentvolumeclaims
                    namespaces: [hawsir]
          provider:
            type: opa
            opa-spec:
              rego: |
                package validate
                import rego.v1
                default validate := false
                validate if {
                  some pvc in input.pvcs
                  startswith(pvc.metadata.name, "data-")
                  endswith(pvc.metadata.name, "-postgres-0")
                  pvc.status.phase == "Bound"
                }
