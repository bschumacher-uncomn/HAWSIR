  back-matter:
    resources:
      - uuid: 82ea990f-6385-5fc8-b178-7adb31370e81
        title: "Every NAVIFI pod runs as non-root with all capabilities dropped"
        rlinks:
          - href: lula.dev
        description: |
          metadata:
            name: navifi-pods-nonroot
            uuid: 97fb9585-082e-5f9a-94e5-eda8654696e0
          domain:
            type: kubernetes
            kubernetes-spec:
              resources:
                - name: pods
                  resource-rule:
                    version: v1
                    resource: pods
                    namespaces: [navifi]
          provider:
            type: opa
            opa-spec:
              rego: |
                package validate
                import rego.v1
                default validate := false
                validate if {
                  count(input.pods) > 0
                  every pod in input.pods {
                    pod.spec.securityContext.runAsNonRoot == true
                    every c in pod.spec.containers {
                      c.securityContext.allowPrivilegeEscalation == false
                      "ALL" in c.securityContext.capabilities.drop
                    }
                  }
                }
      - uuid: b266199c-f5bb-5633-8cc5-f737266819c1
        title: "NAVIFI namespace is enrolled in the Istio mesh (mTLS) by UDS Core"
        rlinks:
          - href: lula.dev
        description: |
          metadata:
            name: navifi-mesh-enrolled
            uuid: 580cce16-a0b8-5cc3-8770-b79f7a28b3e5
          domain:
            type: kubernetes
            kubernetes-spec:
              resources:
                - name: ns
                  resource-rule:
                    version: v1
                    resource: namespaces
                    name: navifi
          provider:
            type: opa
            opa-spec:
              rego: |
                package validate
                import rego.v1
                default validate := false
                validate if input.ns.metadata.labels["istio-injection"] == "enabled"
                validate if input.ns.metadata.labels["istio.io/dataplane-mode"] == "ambient"
      - uuid: 92ddabed-adcb-5650-87dd-40a51d2810b7
        title: "Append-only audit volume exists and is bound"
        rlinks:
          - href: lula.dev
        description: |
          metadata:
            name: navifi-audit-volume
            uuid: dea3939b-b94a-5fa8-bf31-1750d4460582
          domain:
            type: kubernetes
            kubernetes-spec:
              resources:
                - name: pvcs
                  resource-rule:
                    version: v1
                    resource: persistentvolumeclaims
                    namespaces: [navifi]
          provider:
            type: opa
            opa-spec:
              rego: |
                package validate
                import rego.v1
                default validate := false
                validate if {
                  some pvc in input.pvcs
                  endswith(pvc.metadata.name, "-audit")
                  pvc.status.phase == "Bound"
                }
