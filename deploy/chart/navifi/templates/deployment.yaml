apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "navifi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "navifi.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "navifi.labels" . | nindent 8 }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: navifi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8810
          env:
            - name: PORT
              value: "8810"
            - name: NAVIFI_RUNTIME_DIR
              value: /data
            - name: NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
            {{- with (include "navifi.llmUrl" .) }}
            - name: NAVIFI_LLM_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.llm.model .Values.llm.inCluster.enabled }}
            - name: NAVIFI_LLM_MODEL
              value: {{ .Values.llm.inCluster.enabled | ternary .Values.llm.inCluster.model .Values.llm.model | quote }}
            {{- end }}
            {{- if .Values.llm.existingSecret }}
            - name: NAVIFI_LLM_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.llm.existingSecret }}, key: NAVIFI_LLM_KEY }
            {{- end }}
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-audit
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
