{{- if .Values.uds.enabled }}
apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "navifi.labels" . | nindent 4 }}
spec:
  network:
    expose:
      - service: {{ .Release.Name }}
        selector: {{- include "navifi.selector" . | nindent 10 }}
        gateway: {{ .Values.uds.gateway }}
        host: navifi
        port: 8810
    allow:
      - direction: Ingress
        remoteGenerated: IntraNamespace
      - direction: Egress
        remoteGenerated: IntraNamespace
      {{- if and .Values.llm.url (not .Values.llm.inCluster.enabled) }}
      # Shore LLM endpoint, only usable when the link is up. Remove for EMCON builds.
      - direction: Egress
        selector: {{- include "navifi.selector" . | nindent 10 }}
        remoteGenerated: Anywhere
        port: 443
      {{- end }}
  {{- if .Values.uds.sso }}
  sso:
    - name: NAVIFI Watch Floor
      clientId: uds-navifi
      redirectUris:
        - "https://navifi.{{ .Values.domain }}/login"
      enableAuthserviceSelector: {{- include "navifi.selector" . | nindent 8 }}
  {{- end }}
  monitor:
    - selector: {{- include "navifi.selector" . | nindent 8 }}
      portName: http
      targetPort: 8810
      path: /api/metrics
      description: NAVIFI edge metrics
{{- end }}
