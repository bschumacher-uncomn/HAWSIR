{{- if .Values.app.enabled }}
# The web app: static files, and /api proxied to this node's mission-api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "hawsir.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "hawsir.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hawsir.labels" . | nindent 8 }}
        {{- include "hawsir.selector" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: web
          image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag }}"
          imagePullPolicy: {{ .Values.pullPolicy }}
          env:
            - { name: API_UPSTREAM, value: "http://{{ .Release.Name }}-api:8820" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.resources.web | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: conf, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "hawsir.labels" . | nindent 4 }}
spec:
  selector: {{- include "hawsir.selector" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- end }}
