{{- if and .Values.app.enabled .Values.postgres.enabled }}
{{- $name := printf "%s-postgres" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := ternary (index ($existing.data | default dict) "POSTGRES_PASSWORD" | default "" | b64dec) (randAlphaNum 32) (not (empty $existing)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "hawsir.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgres://hawsir:%s@%s-postgres:5432/hawsir" $password .Release.Name | quote }}
{{- end }}
