# One release per node: a ship (or the shore) runs web + mission-api + its own Postgres.
app:
  enabled: true           # false renders only the optional narrator (see values/zarf-narrator-values.yaml)

images:
  web: { repository: ghcr.io/uncomn/hawsir-web, tag: "0.11.0" }
  api: { repository: ghcr.io/uncomn/hawsir-api, tag: "0.11.0" }
  # Swap for registry1.dso.mil/ironbank/opensource/postgres/postgresql in accredited builds.
  postgres: { repository: postgres, tag: "16-alpine" }
pullPolicy: IfNotPresent

# Hostname under the UDS tenant gateway: <host>.<domain>
domain: uds.dev
host: hawsir

node:
  kind: ship              # ship | shore
  ship: ddgB              # ship nodes: the hull this node runs on
  id: ""                  # default: ship-<ship> or shore
  peerUrl: ""             # ship nodes: the shore mission-api, reached over the data link
  missions: ""            # comma-separated mission ids; empty = all
  # Demo controls (clock, link, reset). Off = operational: scenario time follows the wall clock.
  demo: true
  syncTokenSecret: ""     # secret with key SYNC_TOKEN shared by ship and shore
  trustIdentityHeaders: true   # behind UDS Authservice the mesh authenticates the user

postgres:
  enabled: true           # false: use an existing database (externalUrlSecret)
  externalUrlSecret: ""   # secret with key DATABASE_URL
  storage: 5Gi
  storageClass: ""

# Narrative model. Rewording only; never in the calculation path.
llm:
  url: ""                 # external OpenAI-compatible endpoint; blank = template briefs
  model: ""
  existingSecret: ""      # secret with key LLM_API_KEY
  inCluster:
    enabled: false
    image: vllm/vllm-openai:v0.6.3
    model: Qwen/Qwen2.5-3B-Instruct
    gpu: false
    resources:
      requests: { cpu: "2", memory: 6Gi }
      limits: { cpu: "4", memory: 12Gi }

uds:
  # Emit a UDS Package CR: Istio exposure, network allow-list, Keycloak SSO, Prometheus monitor.
  enabled: true
  sso: true
  gateway: tenant

resources:
  web: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 500m, memory: 128Mi } }
  api: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: "2", memory: 1Gi } }
  postgres: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
